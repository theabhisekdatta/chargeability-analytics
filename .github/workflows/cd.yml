name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for MCP
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/chargeability-mcp

      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/chargeability-mcp:latest
            ghcr.io/${{ github.repository }}/chargeability-mcp:${{ github.sha }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/chargeability-fastapi-agent:latest
            ghcr.io/${{ github.repository }}/chargeability-fastapi-agent:${{ github.sha }}