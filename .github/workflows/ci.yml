name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit -v

      - name: Run integration tests
        run: |
          pytest tests/integration -v


  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MCP image
        run: |
          docker build \
            -f docker/Dockerfile.mcp \
            -t chargeability-mcp:latest \
            .

      - name: Build FastAPI image
        run: |
          docker build \
            -f docker/Dockerfile.agent \
            -t chargeability-fastapi-agent:latest \
            .