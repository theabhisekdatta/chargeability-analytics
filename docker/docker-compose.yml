version: "3.9"

services:

  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp

    container_name: chargeability-mcp

    env_file:
      - ../.env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8000:8000"

    restart: unless-stopped


  fastapi:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent

    container_name: chargeability-api

    env_file:
      - ../.env

    depends_on:
      - mcp-server

    ports:
      - "8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped