name: CD

on:
  push:
    branches:
      - development

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chargeability-mcp:latest
            ghcr.io/${{ github.repository_owner }}/chargeability-mcp:${{ github.sha }}


      - name: Build and push FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chargeability-fastapi:latest
            ghcr.io/${{ github.repository_owner }}/chargeability-fastapi:${{ github.sha }}